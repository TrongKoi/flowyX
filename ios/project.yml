# Du phong: neu Xcode khong mo duoc Flowy.xcodeproj, sinh lai bang XcodeGen
#   brew install xcodegen && cd ios && xcodegen generate
name: Flowy
options:
  bundleIdPrefix: vn.boussolex
  deploymentTarget:
    iOS: "16.0"
targets:
  Flowy:
    type: application
    platform: iOS
    sources:
      - path: Flowy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.boussolex.flowy
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Flowy-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Flowy
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Để bạn trả lời bằng giọng nói thay vì gõ."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Để hiểu câu bạn nói. Nhận dạng chạy trên máy khi iOS hỗ trợ."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
