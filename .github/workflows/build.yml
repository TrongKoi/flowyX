name: Build iOS App

on: 
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version
      - name: Build project
        run: swift build -c release
