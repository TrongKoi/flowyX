# ====================================================================
# CI FlowyX — ba trinh bien dich, ba nen tang
# ====================================================================
#
# VI SAO FILE NAY QUAN TRONG HON MOT FILE CI THONG THUONG
#
# Nhom khong co may Mac. Runner `macos-latest` o day la trinh bien dich
# Swift DUY NHAT ma du an co. Moi lan day code len la mot vong bien dich
# iOS — khong co cach nao khac de biet 47 tep Swift co dung kieu hay khong.
#
# Vi vay job iOS PHAI chay het, va phai in ra loi doc duoc. Dung them
# `continue-on-error` vao day.
#
# ----- Vi sao sinh lai project bang XcodeGen thay vi dung .xcodeproj -----
#
# `ios/Flowy.xcodeproj/project.pbxproj` duoc viet tay tren may khong co
# Xcode, va KHONG co scheme nao (`xcshareddata/xcschemes/` trong rong).
# `xcodebuild -scheme Flowy` se bao "scheme not found".
#
# `project.yml` moi la ban goc. XcodeGen sinh lai project + scheme dung
# chuan tu no, nen job nay khong phu thuoc vao mot tep pbxproj viet tay.
#
# ----- Vi sao build cho Simulator chu khong phai may that -----
#
# Build cho `generic/platform=iOS` can chung chi ky. Khong co tai khoan
# Apple Developer trong CI, nen ky se hong. Simulator khong can ky, va
# van bat DU moi loi kieu — thu duy nhat no khong bat la loi luc ky.

name: CI

on:
  push:
    branches: ["main", "main-v5"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  ios:
    name: iOS — bien dich Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Phien ban Xcode
        run: xcodebuild -version

      - name: Cai XcodeGen
        run: brew install xcodegen

      - name: Sinh lai Flowy.xcodeproj tu project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Cac scheme co san
        working-directory: ios
        run: xcodebuild -list -project Flowy.xcodeproj

      - name: Bien dich cho Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Flowy.xcodeproj \
            -scheme Flowy \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  # ------------------------------------------------------------------
  android:
    name: Android — bien dich, test, xuat APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # JDK 17, khong phai 25: AGP 8.5.2 tu choi JDK 25 voi mot cau bao
      # loi kho hieu (`What went wrong: 25.0.2`).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Khong dung android-actions/setup-android: no goi sdkmanager tren
      # goi 'tools' da bi go khoi kho, va do ngay o buoc cai. Runner
      # ubuntu da co san Android SDK o ANDROID_HOME - dung thang.
      - name: Xac nhan Android SDK co san
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test don vi Kotlin
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build APK debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain

      # APK tai ve duoc tu tab Actions — cach nhanh nhat de dua ban moi
      # len may that ma khong can ai mo Android Studio.
      - name: Tai APK len artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowyx-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Tai bao cao test len artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-test-kotlin
          path: android/app/build/reports/tests/

  # ------------------------------------------------------------------
  python:
    name: Python — loi quyet dinh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai pytest
        run: pip install pytest

      # Phai dung trong `adc_wayfinding/`: mot test dung duong dan tuong doi.
      - name: Chay test
        working-directory: adc_wayfinding
        run: python -m pytest tests -q
